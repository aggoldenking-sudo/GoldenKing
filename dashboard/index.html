<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <!-- PANEL IZQUIERDO -->

    <aside class="card">

        <div class="logo">

            👑 GOLDEN KING

        </div>

        <br>

        <label>Lotería</label>

        <select id="loteria"></select>

        <label>Sorteo</label>

        <select id="sorteo"></select>

        <label>Modalidad</label>

        <select id="tipo">

            <option value="animal">Animal</option>

            <option value="terminal">Terminal</option>

            <option value="triple">Triple</option>

            <option value="tripleta">Tripleta</option>

        </select>

        <label>Número</label>

        <input
            id="numero"
            maxlength="3"
            autocomplete="off"
            placeholder="Ej: 25">

        <label>Animal</label>

        <input
            id="animal"
            readonly>

        <label>Monto</label>

        <input
            id="monto"
            type="number"
            placeholder="0">

        <button
            id="agregar"
            class="btn-primary">

            ➕ Agregar Jugada

        </button>

    </aside>

    <!-- PANEL DERECHO -->

    <main>

        <div class="card">

            <div class="header">

                <h2>

                    Ticket Actual

                </h2>

                <span class="badge">

                    En Proceso

                </span>

            </div>

            <table>

                <thead>

                <tr>

                    <th>Lotería</th>

                    <th>Sorteo</th>

                    <th>Número</th>

                    <th>Animal</th>

                    <th>Monto</th>

                    <th></th>

                </tr>

                </thead>

                <tbody id="tablaJugadas">

                </tbody>

            </table>

            <div
                class="total">

                Total Bs.

                <span id="total">

                    0.00

                </span>

            </div>

            <br>

            <div
                style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;">

                <button
                    id="guardar"
                    class="btn-success">

                    💾 Guardar

                </button>

                <button
                    id="imprimir"
                    class="btn-primary">

                    🖨 Imprimir

                </button>

                <button
                    id="nuevo"
                    class="btn-warning">

                    📄 Nuevo

                </button>

                <button
                    id="cancelar"
                    class="btn-danger">

                    ❌ Cancelar

                </button>

            </div>

        </div>

    </main>

</div>

<script src="js/datos.js"></script>

<script src="js/utilidades.js"></script>

<script src="js/ui.js"></script>

<script src="sistema/sorteos.js"></script>

<script src="sistema/sistema.js"></script>

<script src="js/app.js"></script>

</body>

</html>
