<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden King | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #174a7c;
            --accent: #FFD700;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text-main); }

        /* Cabecera Moderna */
        header { 
            background: var(--primary); color: white; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow);
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }

        /* Menú Soft */
        nav { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .menu { 
            background: white; padding: 15px 25px; border-radius: 16px; 
            cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; 
            align-items: center; border: 1px solid #e2e8f0;
        }
        .menu:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: var(--shadow); }
        .activo { background: var(--primary); color: white; }
        .activo i { color: var(--accent); }

        /* Contenido y Tarjetas */
        main { padding: 40px; max-width: 1200px; margin: auto; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { 
            background: var(--card-bg); padding: 30px; border-radius: 20px; 
            box-shadow: var(--shadow); border: 1px solid #f1f5f9; text-align: center;
        }
        .card i { font-size: 30px; color: var(--primary); margin-bottom: 15px; }
        
        /* Botones tipo Píldora */
        .panel button { 
            width: 100%; padding: 15px; border: none; border-radius: 50px; 
            background: var(--primary); color: white; font-weight: 600; 
            margin-bottom: 10px; cursor: pointer; transition: 0.3s;
        }
        .panel button:hover { background: var(--accent); color: var(--primary); }

        @media(max-width:768px) { header { flex-direction: column; text-align: center; } }
    </style>
</head>

<body>
    <header>
        <div class="logo">👑 GOLDEN KING</div>
        <div class="usuario">
            <div id="saludo" style="font-weight:bold;">Buenos días</div>
            <div id="fechaHora" style="font-size:0.85em; opacity: 0.8;"></div>
        </div>
    </header>

    <nav>
        <div class="menu activo"><i class="fas fa-house"></i><span>Inicio</span></div>
        <div class="menu" onclick="window.location.href='../sistema/index.html'"><i class="fas fa-ticket"></i><span>Taquilla</span></div>
        <div class="menu" onclick="window.location.href='../historial/index.html'"><i class="fas fa-clock-rotate-left"></i><span>Historial</span></div>
        <div class="menu salir" onclick="window.location.href='../index.html'"><i class="fas fa-right-from-bracket"></i><span>Salir</span></div>
    </nav>

    <main>
        <h1>Dashboard</h1>
        <div class="cards">
            <div class="card"><i class="fas fa-money-bill-wave"></i><h2>0,00 Bs</h2><p>Ventas del Día</p></div>
            <div class="card"><i class="fas fa-receipt"></i><h2>0</h2><p>Tickets Emitidos</p></div>
        </div>

        <div class="paneles" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="panel" style="background: white; padding: 25px; border-radius: 20px;">
                <h3>Accesos Rápidos</h3>
                <button onclick="window.location.href='../sistema/index.html'">🎟️ Nueva Venta</button>
                <button onclick="window.location.href='../reportes/index.html'">📊 Reportes</button>
            </div>
            <div class="panel" style="background: white; padding: 25px; border-radius: 20px;">
                <h3>Actividad</h3>
                <div id="actividad" style="padding: 20px; border: 2px dashed #e2e8f0; border-radius: 15px; text-align: center;">No hay actividad.</div>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
