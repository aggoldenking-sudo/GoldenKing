<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Golden King POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h2>Golden King POS</h2>
        
        <label>Seleccionar Lotería:</label>
        <select id="loteriaSelect" onchange="window.App.renderMatriz()">
            <option value="Granjita">La Granjita</option>
            <option value="Guacharo">Guacharo Activo</option>
            <option value="LottoActivo">Lotto Activo</option>
            <option value="SelvaPlus">Selva Plus</option>
        </select>

        <label>Sorteo (Hora):</label>
        <select id="horarioSelect">
            <option value="09:00 AM">09:00 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="01:00 PM">01:00 PM</option>
        </select>

        <label>Monto a Apostar:</label>
        <input type="number" id="montoInput" value="50" style="width: 90%; padding: 10px; margin-bottom: 10px;">

        <table id="ticketTable">
            <thead>
                <tr>
                    <th>Jugada</th>
                    <th>Sorteo</th>
                    <th>Monto</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
        <h3 id="totalDisplay">Total: 0</h3>
        <button class="print-btn" onclick="window.print()">IMPRIMIR TICKET</button>
    </aside>

    <main class="grid-panel" id="matrizAnimalitos"></main>

    <script src="js/loterias.js"></script>
    <script src="js/impresion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
