<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden King POS</title>
    <!-- Asegúrate de que style.css esté en la raíz o en la carpeta css correspondiente -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h2>Golden King POS</h2>
        <label>Seleccionar Lotería:</label>
        <select id="loteriaSelect" onchange="window.App.renderMatriz()">
            <option value="Granjita">La Granjita</option>
            <option value="Guacharo">Guacharo Activo</option>
            <option value="LottoActivo">Lotto Activo</option>
            <option value="SelvaPlus">Selva Plus</option>
        </select>
        
        <div class="monto-box">
            <p>Monto: <span id="displayMonto">50</span></p>
            <button class="btn-monto" onclick="window.App.setMonto(10)">10</button>
            <button class="btn-monto" onclick="window.App.setMonto(50)">50</button>
            <button class="btn-monto" onclick="window.App.setMonto(100)">100</button>
        </div>

        <table id="ticketTable"></table>
        <h3 id="totalDisplay">Total: 0</h3>
        <button class="print-btn" onclick="window.print()">IMPRIMIR TICKET</button>
    </aside>

    <main class="grid-panel" id="matrizAnimalitos"></main>

    <!-- Cargamos el motor principal como un módulo -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
