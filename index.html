<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King - Caja</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header>

<h1>👑 GOLDEN KING</h1>

<h3>Sistema de Caja</h3>

<button onclick="window.open('historial/historial.html','Historial','width=900,height=600')">
📋 Historial
</button>

</header>




<section class="panel">


<label>
Lotería:
</label>


<select id="loteriaSelect"></select>



<label>
Horario:
</label>


<select id="horarioSelect">

<option>08:00 AM</option>
<option>09:00 AM</option>
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>12:00 PM</option>
<option>01:00 PM</option>
<option>02:00 PM</option>
<option>03:00 PM</option>
<option>04:00 PM</option>
<option>05:00 PM</option>
<option>06:00 PM</option>
<option>07:00 PM</option>

</select>



<br><br>


<input 
id="codigoAnimal"
placeholder="Código animal"
type="text"
autocomplete="off"
>



<input 
id="montoInput"
placeholder="Monto Bs."
type="number"
>



<button onclick="App.agregarSeleccion()">
➕ Agregar
</button>


</section>





<h2>
🐾 Animalitos
</h2>


<div id="matrizAnimalitos">

</div>





<h2>
🎟️ Ticket Actual
</h2>


<table id="ticketTable">


<thead>

<tr>

<th>
Animal
</th>


<th>
Lotería
</th>


<th>
Hora
</th>


<th>
Monto
</th>


<th>
Eliminar
</th>


</tr>

</thead>



<tbody>

</tbody>


</table>




<h2 id="totalDisplay">
Total: Bs. 0
</h2>




<button class="imprimir" onclick="App.imprimirTicket()">

🖨️ Imprimir Ticket

</button>




<button class="limpiar" onclick="App.limpiarTodo()">

🗑️ Limpiar

</button>





<script src="data.js"></script>

<script src="app.js"></script>


</body>

</html>
