<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Golden King POS</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<aside class="sidebar">


<h2>👑 GOLDEN KING</h2>


<label>LOTERÍA:</label>

<select id="loteriaSelect" onchange="window.App.renderMatriz()">

<option value="Granjita">La Granjita</option>

<option value="Guacharo">Guacharo Activo</option>

<option value="LottoActivo">Lotto Activo</option>

<option value="SelvaPlus">Selva Plus</option>

</select>




<label>SORTEO:</label>

<select id="horarioSelect">

<option value="08:00 AM">08:00 AM</option>
<option value="09:00 AM">09:00 AM</option>
<option value="10:00 AM">10:00 AM</option>
<option value="11:00 AM">11:00 AM</option>
<option value="12:00 PM">12:00 PM</option>
<option value="01:00 PM">01:00 PM</option>
<option value="02:00 PM">02:00 PM</option>
<option value="03:00 PM">03:00 PM</option>
<option value="04:00 PM">04:00 PM</option>
<option value="05:00 PM">05:00 PM</option>
<option value="06:00 PM">06:00 PM</option>
<option value="07:00 PM">07:00 PM</option>

</select>





<label>CÓDIGO RÁPIDO:</label>

<input 
type="text"
id="codigoAnimal"
placeholder="Ej: 27"
maxlength="2">





<label>MONTO:</label>

<input 
type="number"
id="montoInput"
value="50">





<div class="acciones">


<button onclick="window.App.agregarSeleccion()">

➕ AGREGAR

</button>


<button onclick="window.App.limpiarTodo()">

🗑 LIMPIAR

</button>


</div>





<table id="ticketTable">


<thead>

<tr>

<th>Jugada</th>

<th>Sorteo</th>

<th>Monto</th>

<th>X</th>

</tr>

</thead>


<tbody></tbody>


</table>




<h3 id="totalDisplay">

Total: Bs. 0

</h3>





<button class="print-btn" onclick="window.App.imprimirTicket()">

🖨 IMPRIMIR

</button>



</aside>





<main 
class="grid-panel"
id="matrizAnimalitos">

</main>





<script src="js/loterias.js"></script>

<script src="js/impresion.js"></script>

<script src="js/app.js"></script>


</body>

</html>
