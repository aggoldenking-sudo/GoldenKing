<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Golden King | POS</title>
</head>
<body>

    <!-- Pantalla de Login -->
    <section id="login" class="view">
        <h2>Acceso Golden King</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <button onclick="intentarLogin()">Ingresar</button>
    </section>

    <!-- Dashboard (Oculto al inicio) -->
    <section id="dashboard" class="view" style="display:none;">
        <header>
            <h1>Golden King - Panel de Control</h1>
            <nav>
                <button onclick="cargarJuego('animalitos')">Animalitos</button>
                <button onclick="cargarJuego('lotto')">Lotto Activo</button>
            </nav>
        </header>
        <main id="area-juego">
            <h2>Seleccione un juego para comenzar</h2>
        </main>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
