<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- PANEL IZQUIERDO -->

<aside class="sidebar">


<div class="logo">
👑 GOLDEN KING
</div>


<h3>SORTEOS</h3>


<div id="listaSorteos">

<!-- Aquí app.js carga las 4 loterías y horarios -->

</div>


</aside>





<!-- AREA PRINCIPAL -->

<main class="main-content">



<div class="card">


<h2>Nueva Jugada</h2>


<label>
Número
</label>


<input 
id="numero"
type="text"
placeholder="Ejemplo: 00"
autocomplete="off">



<label>
Monto Bs.
</label>


<input 
id="monto"
type="number"
placeholder="Ejemplo: 50">



<button 
id="agregar"
class="btn-agregar">

AGREGAR JUGADA

</button>


</div>







<div class="ticket">


<h2>Ticket</h2>



<div id="ticket">


<p>No hay jugadas</p>


</div>




<div class="total">

TOTAL:
<span id="total">
0
</span>
Bs

</div>



</div>




</main>






<!-- DATOS DE LOTERIAS -->

<script src="js/datos.js"></script>


<!-- SISTEMA -->

<script src="js/app.js"></script>



</body>

</html>
