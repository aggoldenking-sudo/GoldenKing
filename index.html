<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- PANEL IZQUIERDO -->

<aside class="sidebar">


<div class="logo">
👑 GOLDEN KING
</div>


<h3>SORTEOS</h3>


<div id="listaSorteos">

</div>


</aside>





<!-- AREA PRINCIPAL -->

<main class="main-content">



<div class="card">


<h2>Nueva Jugada</h2>



<label>
Número
</label>


<input 
type="text"
id="numero"
placeholder="Ejemplo: 00"
autocomplete="off">



<label>
Monto Bs.
</label>


<input
type="number"
id="monto"
placeholder="Ejemplo: 50">



<button 
id="agregar"
class="btn-agregar">

➕ AGREGAR JUGADA

</button>


</div>







<div class="ticket">


<h2>Ticket</h2>



<div id="ticket">

<p>No hay jugadas</p>

</div>





<div class="total">

TOTAL:

<span id="total">

0

</span>

Bs

</div>




<button 
id="imprimir"
class="btn-imprimir">

🖨️ IMPRIMIR TICKET

</button>



</div>




</main>






<script src="js/datos.js"></script>

<script src="js/app.js"></script>



</body>

</html>
