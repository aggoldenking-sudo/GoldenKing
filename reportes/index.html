<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King | Reportes</title>

<link rel="stylesheet" href="reportes.css">

</head>


<body>


<header>


<div class="logo">
👑 GOLDEN KING
</div>


<div>


<button onclick="window.location.href='../dashboard/index.html'">

⬅ Dashboard

</button>


<button onclick="window.print()">

🖨️ Imprimir

</button>


</div>


</header>





<main>


<h1>
📊 Reportes de Agencia
</h1>



<div class="filtros">


<label>

Fecha:

</label>


<input 
type="date"
id="fecha">


<button id="buscar">

🔎 Buscar

</button>


</div>






<section class="resumen">


<div class="card">

<h2 id="ventas">
0 Bs
</h2>

<p>
Ventas Totales
</p>

</div>



<div class="card">

<h2 id="tickets">
0
</h2>

<p>
Tickets
</p>

</div>




<div class="card">

<h2 id="jugadas">
0
</h2>

<p>
Jugadas
</p>

</div>




<div class="card">

<h2 id="ganancia">
0 Bs
</h2>

<p>
Ganancia Estimada
</p>

</div>



</section>







<div class="tabla">


<h2>
Detalle de Ventas
</h2>



<table>


<thead>

<tr>

<th>Hora</th>

<th>Lotería</th>

<th>Número</th>

<th>Animal</th>

<th>Monto</th>


</tr>


</thead>



<tbody id="tablaReporte">


</tbody>



</table>



</div>








<div class="cierre">


<h2>
Cierre de Caja
</h2>


<p>
Total vendido:
<b id="cierreVenta">
0 Bs
</b>
</p>


<p>
Premios pagados:
<b id="premios">
0 Bs
</b>
</p>


<p>
Caja final:
<b id="cajaFinal">
0 Bs
</b>
</p>



</div>




</main>



<script src="reportes.js"></script>


</body>

</html>
