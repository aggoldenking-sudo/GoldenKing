<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King | Sistema de Taquillas</title>


<!-- Fuente profesional -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" 
rel="stylesheet">


<!-- Estilos Login -->

<link rel="stylesheet" href="./login.css">


</head>


<body>


<div class="login-container">



    <!-- MARCA -->

    <div class="brand">


        <h1>
            GOLDEN KING
        </h1>


        <p>
            Sistema Profesional de Taquillas
        </p>


        <span>
            Versión 3.0
        </span>


    </div>






    <!-- LOGIN -->

    <div class="login-card">


        <h2>
            Bienvenido
        </h2>


        <p class="subtitle">
            Ingrese sus datos para continuar
        </p>





        <form id="loginForm">



            <div class="input-group">


                <label for="email">
                    Usuario o correo
                </label>



                <input

                type="email"

                id="email"

                placeholder="admin@golden.com"

                autocomplete="email"

                required>


            </div>







            <div class="input-group">


                <label for="password">
                    Contraseña
                </label>




                <input

                type="password"

                id="password"

                placeholder="********"

                autocomplete="current-password"

                required>




            </div>







            <div class="options">


                <label>


                    <input

                    type="checkbox"

                    id="remember">


                    Recordar sesión


                </label>


            </div>








            <button type="submit">


                Iniciar Sesión


            </button>







            <p

            id="message"

            class="message">

            </p>







        </form>




    </div>




</div>





<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>




<!-- LOGIN SYSTEM -->

<script 
type="module" 
src="./login.js">
</script>




</body>

</html>
