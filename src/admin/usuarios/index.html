<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Golden King | Usuarios
</title>


<link rel="stylesheet" href="./usuarios.css">


</head>


<body>


<div class="container">


<header>


<div>

<h1>
👥 Gestión de Usuarios
</h1>


<p>
Administración de usuarios y permisos
</p>


</div>



<a href="../dashboard.html">
⬅ Dashboard
</a>



</header>







<section class="card">


<h2>
➕ Crear Usuario
</h2>





<form id="usuarioForm">





<div class="grupo">


<label>
Nombre
</label>


<input

id="nombre"

type="text"

placeholder="Nombre completo"

required>


</div>







<div class="grupo">


<label>
Correo
</label>


<input

id="email"

type="email"

placeholder="correo@goldenking.com"

required>


</div>








<div class="grupo">


<label>
Rol
</label>


<select id="rol">


<option value="taquilla">
Taquilla
</option>


<option value="administrador">
Administrador
</option>


</select>


</div>








<div class="grupo">


<label>
Taquilla asignada
</label>


<select id="taquilla">


<option value="">
Seleccione taquilla
</option>


</select>


</div>








<button type="submit">

Crear Usuario

</button>




<p id="mensaje"></p>



</form>



</section>









<section class="card">


<h2>
👥 Usuarios Registrados
</h2>



<div id="listaUsuarios">

Cargando...

</div>



</section>






</div>






<script 
type="module"
src="./usuarios.js">
</script>


</body>

</html>
