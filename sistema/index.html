<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King | Taquilla</title>

<link rel="stylesheet" href="sistema.css">

</head>


<body>


<header class="topbar">

<div class="logo">
👑 GOLDEN KING
</div>


<button onclick="window.location.href='../dashboard/index.html'">

⬅ Dashboard

</button>


</header>





<div class="contenedor">



<!-- SORTEOS -->

<section class="sorteos">


<h2>
🎰 Sorteos
</h2>



<div id="listaSorteos"></div>


</section>






<!-- JUGADA -->

<section class="jugada">


<h2>
🎟️ Nueva Jugada
</h2>



<label>
Número
</label>


<input 
id="numero"
type="text"
maxlength="2"
placeholder="00">





<label>
Monto Bs
</label>


<input 
id="monto"
type="number"
placeholder="50">





<button id="agregar">

➕ AGREGAR JUGADA

</button>




</section>







<!-- TICKET -->

<section class="ticket">


<h2>
🧾 Ticket
</h2>



<div id="ticket">

No hay jugadas

</div>




<div class="total">

TOTAL:

<span id="total">

0

</span>

Bs

</div>





<button id="imprimir">

🖨️ IMPRIMIR

</button>



<button id="copiar">

📲 WHATSAPP

</button>



</section>



</div>






<script src="../js/datos.js"></script>

<script src="sistema.js"></script>

</html>
