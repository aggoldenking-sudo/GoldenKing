<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Golden King POS - Sistema de Taquilla">

<link rel="stylesheet" href="sistema.css">

<title>Golden King POS - Taquilla</title>

</head>


<body>


<div id="app">


<header>

<h1>👑 Golden King</h1>

<p>Sistema de Taquilla</p>

</header>



<main>


<section id="sales-form">


<div class="bloque">


<h2>🎟️ Nueva Jugada</h2>



<label>Lotería</label>

<select id="loteria">

<option value="Lotto Activo">
Lotto Activo
</option>


<option value="La Granjita">
La Granjita
</option>


</select>



<label>Número</label>

<input 
id="numero"
maxlength="2"
placeholder="Ej: 01">



<div id="animal">

🐾 Animal

</div>



<label>Monto</label>

<input 
id="monto"
type="number"
placeholder="Bs">



<button id="agregar">

➕ Agregar Jugada

</button>


</div>





<div class="bloque">


<h2>🎫 Ticket</h2>


<div id="ticket">

Sin jugadas

</div>



<h3>

Total:
<span id="total">
0
</span> Bs

</h3>



<button id="limpiar">

🗑️ Limpiar Ticket

</button>


<button id="imprimir">

🖨️ Imprimir

</button>


</div>



</section>


</main>



<noscript>

<p>
⚠️ Este sistema requiere JavaScript habilitado.
</p>

</noscript>


</div>



<script type="module" src="sistema.js"></script>


</body>

</html>
