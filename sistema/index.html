<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King | Taquilla</title>

<link rel="stylesheet" href="sistema.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>


<body>


<header class="topbar">


<div class="logo">

👑 <strong>GOLDEN KING</strong>

<span>| TAQUILLA</span>

</div>


<div class="topbar-right">

🕒 <span id="hora">00:00:00</span>

</div>


</header>





<main class="contenedor">



<!-- NUEVA JUGADA -->

<section class="panel">


<h2>🎯 Nueva Jugada</h2>



<div class="campo">


<label>

Seleccione Sorteos

</label>



<div id="sorteos">


Cargando sorteos...


</div>


</div>





<div class="campo">


<label>

Números

</label>


<textarea

id="numeros"

placeholder="Ejemplo:
01 05 12
00 25 38"

></textarea>


</div>





<div id="animal"

class="preview">


Animal aparecerá aquí


</div>






<div class="campo">


<label>

Monto Bs.

</label>



<input

id="monto"

type="number"

placeholder="50">


</div>






<button

id="agregar"

class="btn-principal">


➕ Agregar Jugada


</button>



</section>







<!-- TICKET -->


<section class="panel">


<div class="ticket-header">


<h2>

🎟 Ticket

</h2>



<span id="numeroTicket">

#000001

</span>


</div>





<div id="ticket">


<p class="vacio">

No hay jugadas

</p>


</div>







<div class="total">


<strong>

Total:

<span id="total">

0.00

</span>

Bs


</strong>


</div>






<div class="acciones">


<button id="guardar">

💾 Guardar

</button>



<button id="imprimir">

🖨 Imprimir

</button>



<button id="whatsapp">

📲 WhatsApp

</button>


</div>



</section>









<!-- INFORMACION -->


<section class="panel">


<h2>

🐾 Información

</h2>



<h3>

Animales

</h3>


<div id="animales">


</div>






<h3>

🕒 Horarios

</h3>


<div id="horarios">


</div>



</section>






</main>






<!-- DATOS DEL SISTEMA -->


<script src="datos/loterias.js"></script>





<!-- FUNCIONES -->


<script src="sistema.js"></script>



</body>


</html>
