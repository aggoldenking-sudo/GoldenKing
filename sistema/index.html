<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Golden King | Taquilla</title>

    <link rel="stylesheet" href="sistema.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header class="topbar">

    <div class="logo">

        👑 <strong>GOLDEN KING</strong>

        <span>Taquilla</span>

    </div>

    <div class="topbar-right">

        <span id="hora">00:00:00</span>

        <button class="btn-dashboard">

            Dashboard

        </button>

    </div>

</header>

<main class="contenedor">

    <!-- PANEL IZQUIERDO -->

    <section class="panel">

        <h2>Nueva Jugada</h2>

        <!-- SELECTOR DE SORTEOS -->

        <div class="campo">

            <label>Sorteos</label>

            <button id="abrirSelector" class="selector">

                🎯 Seleccionar sorteos

            </button>

            <div id="selectorSorteos" class="selector-panel">

            </div>

        </div>

        <!-- NUMEROS -->

        <div class="campo">

            <label>Números</label>

            <textarea
                id="numeros"
                rows="4"
                placeholder="Ejemplo:

12 25 36

00 01

12-20"></textarea>

        </div>

        <!-- VISTA PREVIA -->

        <div class="campo">

            <label>Animales</label>

            <div id="animalesPreview" class="preview">

                Escriba un número...

            </div>

        </div>

        <!-- MODALIDAD -->

        <div class="campo">

            <label>Modalidad</label>

            <select id="modalidad">

            </select>

        </div>

        <!-- MONTO -->

        <div class="campo">

            <label>Monto</label>

            <input
                id="monto"
                type="number"
                placeholder="0">

        </div>

        <button id="agregar" class="btn-principal">

            ➕ Agregar al Ticket

        </button>

    </section>

    <!-- PANEL DERECHO -->

    <section class="panel">

        <div class="ticket-header">

            <h2>Ticket</h2>

            <span id="numeroTicket">

                #000001

            </span>

        </div>

        <div id="ticket">

            <p class="vacio">

                No hay jugadas.

            </p>

        </div>

        <div class="total">

            <span>Total</span>

            <strong>

                Bs

                <span id="total">

                    0.00

                </span>

            </strong>

        </div>

        <div class="acciones">

            <button id="guardar">

                💾 Guardar

            </button>

            <button id="imprimir">

                🖨 Imprimir

            </button>

            <button id="whatsapp">

                📲 WhatsApp

            </button>

        </div>

    </section>

</main>

<!-- DATOS -->

<script src="datos/LottoActivo/animales.js"></script>

<script src="datos/LottoActivo/horarios.js"></script>

<script src="datos/LottoActivo/modalidades.js"></script>

<script src="datos/LottoActivo/resultados.js"></script>

<script src="datos/LottoActivo/configuracion.js"></script>

<!-- TICKET -->

<script src="ticket/modelo.js"></script>

<script src="ticket/imprimir.js"></script>

<script src="ticket/whatsapp.js"></script>

<!-- SISTEMA -->

<script src="sistema.js"></script>

</body>

</html>
