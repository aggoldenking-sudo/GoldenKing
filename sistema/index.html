<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden King | Taquilla</title>

<link rel="stylesheet" href="sistema.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>


<body>


<header class="topbar">

    <div class="logo">

        👑 GOLDEN KING

        <span> | TAQUILLA</span>

    </div>


    <div class="top-info">

        <span id="hora">
            00:00:00
        </span>

        <button 
        onclick="window.location.href='../dashboard/index.html'"
        class="btn-volver">

        ⬅ Dashboard

        </button>

    </div>

</header>



<main class="taquilla">


<section class="panel jugada">


<h2>🎟 Nueva Jugada</h2>


<label>
Lotería
</label>

<select id="loteria">

<option>
Seleccione
</option>

</select>



<label>
Sorteo
</label>

<select id="sorteo">

<option>
Seleccione
</option>

</select>



<label>
Número
</label>

<input 
id="numero"
type="text"
maxlength="2"
placeholder="00"
autocomplete="off">



<div id="animalEncontrado" class="animal">

</div>



<label>
Monto Bs.
</label>

<input 
id="monto"
type="number"
placeholder="50">



<button 
id="agregar"
class="btn-primary">

➕ Agregar Jugada

</button>


</section>





<section class="panel ticket">


<div class="ticket-header">

<h2>
🎟 Ticket
</h2>

<span id="numeroTicket">
#000001
</span>

</div>



<div id="ticket">


<p class="vacio">

No hay jugadas

</p>


</div>



<div class="total">

TOTAL:

<strong>

<span id="total">
0.00
</span>

Bs

</strong>

</div>



<div class="acciones">


<button 
id="guardar"
class="btn-success">

💾 Guardar

</button>


<button 
id="imprimir"
class="btn-primary">

🖨 Imprimir

</button>


<button 
id="whatsapp"
class="btn-whatsapp">

📲 WhatsApp

</button>


</div>


</section>


</main>



<script src="animales.js"></script>

<script src="ticket/modelo.js"></script>

<script src="ticket/calcular.js"></script>

<script src="ticket/guardar.js"></script>

<script src="ticket/imprimir.js"></script>

<script src="ticket/whatsapp.js"></script>

<script src="sistema.js"></script>


</body>

</html>
